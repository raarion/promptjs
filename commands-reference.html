<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptJS v1.1.1 — Command Reference</title>
    <script src="https://cdn.jsdelivr.net/npm/@raarion/prompt-js/dist/promptjs.standalone.min.js"></script>
  </head>
  <body>
    <!-- ═══════════════ PROMPTJS STANDALONE ═══════════════ -->
    <script type="text/pjs">
      ---
      judul: "PromptJS Command Reference"
      versi: "v1.1.1"
      placeholderCari: "Cari command... (misal: build, test, lint, audit)"
      ---

      Halaman Utama:
          data cari = ""

          Gaya:
              *,
              *::before,
              *::after
                  box-sizing: border-box
                  margin: 0
                  padding: 0

              body
                  font-family: 'Inter', 'SF Pro', system-ui, sans-serif
                  background: #0a0a1a
                  color: #e0e0f0
                  min-height: 100vh

              .container
                  position: relative
                  z-index: 1
                  max-width: 900px
                  margin: 0 auto
                  padding: 24px 20px 60px

              header
                  text-align: center
                  padding: 40px 0 24px

              header .logo
                  font-size: 3rem
                  display: block
                  margin-bottom: 8px
                  filter: drop-shadow(0 0 20px rgba(255,0,110,0.3))

              header h1
                  font-size: 2rem
                  font-weight: 800
                  background: linear-gradient(135deg, #ff006e, #ff99c8, #7dd3fc)
                  -webkit-background-clip: text
                  -webkit-text-fill-color: transparent
                  background-clip: text

              header p
                  color: #8888aa
                  margin-top: 6px
                  font-size: 0.95rem

              .badge-row
                  display: flex
                  gap: 8px
                  justify-content: center
                  flex-wrap: wrap
                  margin-top: 14px

              .badge
                  font-size: 0.72rem
                  font-weight: 700
                  padding: 4px 12px
                  border-radius: 20px
                  border: 1px solid rgba(255, 255, 255, 0.1)
                  background: rgba(255, 255, 255, 0.04)
                  color: #9999bb
                  letter-spacing: 0.02em

              .badge.hl
                  color: #7dd3fc
                  border-color: rgba(125, 211, 252, 0.25)

              .search-wrap
                  position: sticky
                  top: 12px
                  z-index: 10
                  margin: 0 0 28px

              .search-box
                  width: 100%
                  padding: 12px 16px 12px 42px
                  border-radius: 12px
                  border: 1px solid rgba(255, 255, 255, 0.1)
                  background: rgba(15, 15, 35, 0.85)
                  backdrop-filter: blur(12px)
                  color: #e0e0f0
                  font-size: 0.95rem
                  outline: none
                  transition: border-color 0.2s

              .search-box:focus
                  border-color: #ff006e

              .search-icon
                  position: absolute
                  left: 14px
                  top: 50%
                  transform: translateY(-50%)
                  color: #666
                  pointer-events: none
                  font-size: 0.95rem

              .category
                  margin-bottom: 28px

              .cat-header
                  display: flex
                  align-items: center
                  gap: 10px
                  margin-bottom: 14px
                  padding-bottom: 8px
                  border-bottom: 1px solid rgba(255, 255, 255, 0.06)

              .cat-emoji
                  font-size: 1.4rem

              .cat-title
                  font-size: 1.05rem
                  font-weight: 700
                  color: #c0c0d8

              .cat-count
                  font-size: 0.65rem
                  font-weight: 700
                  padding: 2px 8px
                  border-radius: 10px
                  background: rgba(255, 255, 255, 0.05)
                  color: #6666aa

              .cmd-row
                  display: flex
                  align-items: center
                  gap: 10px
                  padding: 8px 12px
                  border-radius: 8px
                  transition: background 0.15s
                  margin-bottom: 2px

              .cmd-row:hover
                  background: rgba(255, 255, 255, 0.03)

              .cmd-code
                  flex: 1
                  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace
                  font-size: 0.82rem
                  color: #7dd3fc
                  min-width: 0
                  overflow-wrap: anywhere
                  line-height: 1.5

              .cmd-desc
                  font-size: 0.78rem
                  color: #7777a0
                  flex-shrink: 0
                  max-width: 340px
                  min-width: 140px
                  line-height: 1.4

              .copy-btn
                  flex-shrink: 0
                  width: 32px
                  height: 32px
                  border-radius: 8px
                  border: 1px solid rgba(255, 255, 255, 0.08)
                  background: rgba(255, 255, 255, 0.03)
                  color: #555
                  cursor: pointer
                  display: flex
                  align-items: center
                  justify-content: center
                  transition: all 0.15s
                  font-size: 0.85rem

              .copy-btn:hover
                  color: #7dd3fc
                  border-color: rgba(125, 211, 252, 0.3)
                  background: rgba(125, 211, 252, 0.06)

              .copy-btn.copied
                  color: #86efac
                  border-color: rgba(134, 239, 172, 0.4)
                  background: rgba(134, 239, 172, 0.08)

              .no-result
                  text-align: center
                  padding: 60px 20px
                  color: #5555aa

              .no-result .big
                  font-size: 3rem
                  display: block
                  margin-bottom: 12px

              .toast
                  position: fixed
                  bottom: 24px
                  left: 50%
                  transform: translateX(-50%) translateY(100px)
                  background: #1a1a30
                  border: 1px solid rgba(134, 239, 172, 0.3)
                  color: #86efac
                  padding: 10px 20px
                  border-radius: 10px
                  font-size: 0.85rem
                  font-weight: 600
                  z-index: 100
                  pointer-events: none
                  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1)
                  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4)

              .toast.show
                  transform: translateX(-50%) translateY(0)

              footer
                  text-align: center
                  padding: 20px
                  color: #444466
                  font-size: 0.75rem
                  border-top: 1px solid rgba(255, 255, 255, 0.04)
                  margin-top: 32px

              footer a
                  color: #7dd3fc
                  text-decoration: none

              @media (max-width: 680px)
                  header h1
                      font-size: 1.5rem

                  .cmd-row
                      flex-wrap: wrap
                      gap: 6px

                  .cmd-code
                      flex-basis: 100%

                  .cmd-desc
                      flex-basis: calc(100% - 46px)
                      max-width: none

                  .copy-btn
                      order: 3

          Buat div.container:
              Buat header:
                  Buat span.logo: "🌀"
                  Buat h1: $judul
                  Buat p: "Klik ikon 📋 di setiap command untuk copy — search untuk filter real-time"
                  Buat div.badge-row:
                      Buat span.badge.hl: $versi
                      Buat span.badge: "60+ commands"
                      Buat span.badge: "10 kategori"
                      Buat span.badge: "🇮🇩 Standalone"

              Buat div.search-wrap:
                  Buat span.search-icon: "🔍"
                  Buat masukan#search-input.search-box:
                      placeholder = $placeholderCari
                      on_diketik = simpan document.querySelector("#search-input").value ke cari

              Buat div#cmd-container: ""

              Buat footer:
                  Buat span:
                      "Dibangun dengan 💚 di Indonesia · "
                      Buat a:
                          "github.com/raarion/promptjs"
                          href = "https://github.com/raarion/promptjs"

              Buat div.toast#toast:
                  "✓ Tersalin!"

          Saat cari:
              jalankan renderCommands(cari)
    </script>

    <!-- Imperative JS — data + render engine + copy logic -->
    <script>
      var COMMANDS = [
        {
          e: '📦',
          t: 'NPM Scripts',
          b: 'package.json',
          i: [
            { c: 'npm test', d: 'Jalankan seluruh suite testing (Vitest)' },
            { c: 'npm run test:watch', d: 'Test dalam mode watch' },
            { c: 'npm run coverage', d: 'Test + laporan code coverage' },
            { c: 'npm run mutation', d: 'Stryker mutation testing' },
            { c: 'npm run lint', d: 'Periksa kode dengan ESLint' },
            { c: 'npm run lint:fix', d: 'Periksa & auto-fix ESLint' },
            { c: 'npm run typecheck', d: 'Type check JSDoc (TypeScript)' },
            { c: 'npm run format', d: 'Format kode dengan Prettier' },
            { c: 'npm run format:check', d: 'Cek format tanpa mengubah' },
            { c: 'npm run build', d: 'Build produksi lengkap' },
            { c: 'npm run standalone', d: 'Build bundle browser standalone' },
            { c: 'npm run pages:build', d: 'Build situs showcase' },
            { c: 'npm run pages:deploy', d: 'Deploy ke GitHub Pages' },
            { c: 'npm run audit', d: 'Cek kerentanan keamanan' },
            { c: 'npm run audit:fix', d: 'Auto-fix kerentanan keamanan' },
          ],
        },
        {
          e: '💻',
          t: 'CLI Commands',
          b: 'pjs',
          i: [
            { c: 'pjs compile <input> [output]', d: 'Kompilasi file .pjs → .html' },
            { c: 'pjs build <source> <dest>', d: 'Build seluruh project' },
            { c: 'pjs init [project-name]', d: 'Inisialisasi project baru' },
            { c: 'pjs serve [port]', d: 'Dev server + live reload' },
            { c: 'pjs watch <input> <output>', d: 'Watch mode auto-compile' },
            { c: 'pjs validate <file>', d: 'Validasi sintaks tanpa kompilasi' },
            { c: 'pjs version', d: 'Tampilkan versi PromptJS' },
            { c: 'pjs help', d: 'Tampilkan bantuan CLI' },
            { c: 'pjs -o, --output <dir>', d: 'Tentukan folder output' },
            { c: 'pjs -m, --minify', d: 'Minify output HTML/JS' },
            { c: 'pjs -s, --standalone', d: 'Gunakan runtime standalone' },
            { c: 'pjs -w, --watch', d: 'Enable watch mode' },
            { c: 'pjs -v, --verbose', d: 'Output detail/log verbose' },
            { c: 'pjs -c, --config <file>', d: 'Konfigurasi custom' },
            { c: 'pjs --no-cache', d: 'Disable caching build' },
            { c: 'pjs --sourcemap', d: 'Generate source map' },
          ],
        },
        {
          e: '🔐',
          t: 'Git Hooks',
          b: 'Husky',
          i: [
            { c: 'git add . && git commit -m "..."', d: 'Pre-commit (lint-staged) otomatis' },
            { c: 'git push', d: 'Pre-push (full CI gate) otomatis' },
          ],
        },
        {
          e: '🧪',
          t: 'Testing Commands',
          b: 'Vitest',
          i: [
            { c: 'npx vitest run', d: 'Jalankan semua test' },
            { c: 'npx vitest watch', d: 'Test dalam mode watch' },
            { c: 'npx vitest run --coverage', d: 'Test + coverage report' },
            { c: 'npx vitest run tests/file.test.js', d: 'Jalankan test spesifik' },
            { c: 'npx vitest run --reporter=verbose', d: 'Output test detail' },
            { c: 'npx vitest run --bail=1', d: 'Stop setelah failure pertama' },
            { c: 'npx vitest run --grep "pattern"', d: 'Filter by name pattern' },
          ],
        },
        {
          e: '📊',
          t: 'Code Quality Tools',
          b: 'ESLint · Prettier · tsc',
          i: [
            { c: 'npx eslint src/', d: 'Lint semua file src/' },
            { c: 'npx eslint src/**/*.js --fix', d: 'Auto-fix ESLint' },
            { c: 'npx eslint src/cli/index.js', d: 'Lint file spesifik' },
            { c: 'npx prettier --write src/', d: 'Format semua file src/' },
            { c: 'npx prettier --check src/', d: 'Cek format' },
            { c: 'npx prettier --write README.md', d: 'Format file spesifik' },
            { c: 'npx tsc --noEmit', d: 'Type check tanpa generate' },
            { c: 'npx tsc --noEmit --pretty', d: 'Type check output berwarna' },
          ],
        },
        {
          e: '📦',
          t: 'Package Management',
          b: 'npm',
          i: [
            { c: 'npm install', d: 'Install semua dependencies' },
            { c: 'npm install --production', d: 'Hanya production deps' },
            { c: 'npm install <package>', d: 'Install package baru' },
            { c: 'npm install <package> --save-dev', d: 'Install dev dependency' },
            { c: 'npm uninstall <package>', d: 'Uninstall package' },
            { c: 'npm update', d: 'Update semua packages' },
            { c: 'npm outdated', d: 'Cek package yang ada update' },
            { c: 'npm ls', d: 'List installed packages (tree)' },
            { c: 'npm audit', d: 'Cek kerentanan keamanan' },
            { c: 'npm audit --json', d: 'Audit format JSON' },
            { c: 'npm audit fix', d: 'Auto-fix (non-breaking)' },
            { c: 'npm audit fix --force', d: 'Auto-fix + breaking changes' },
          ],
        },
        {
          e: '🏷️',
          t: 'Release & Versioning',
          b: 'npm version',
          i: [
            { c: 'npm version patch', d: 'Bump patch: 1.1.1 → 1.1.2' },
            { c: 'npm version minor', d: 'Bump minor: 1.1.1 → 1.2.0' },
            { c: 'npm version major', d: 'Bump major: 1.1.1 → 2.0.0' },
            { c: 'npm version 1.2.3', d: 'Set versi spesifik' },
            { c: 'git tag -a v1.1.1 -m "Release v1.1.1"', d: 'Buat Git tag' },
            { c: 'npm publish --access public', d: 'Publish ke npm registry' },
            { c: 'npm publish --dry-run', d: 'Simulasi publish' },
          ],
        },
        {
          e: '🌐',
          t: 'GitHub Pages & Deploy',
          b: 'Deploy',
          i: [
            { c: 'npm run pages:build', d: 'Build situs showcase' },
            { c: 'npm run pages:deploy', d: 'Deploy ke GitHub Pages' },
            { c: 'npx gh-pages -d dist-pages', d: 'Manual deploy via gh-pages' },
          ],
        },
        {
          e: '🔍',
          t: 'Debugging & Inspection',
          b: 'Debug',
          i: [
            { c: 'node --inspect src/cli/index.js compile app.pjs', d: 'Debug CLI' },
            {
              c: 'node --inspect-brk node_modules/.bin/vitest run tests/test.js',
              d: 'Debug test spesifik',
            },
            { c: 'npm pack --dry-run', d: 'Lihat isi package' },
            { c: 'npm run analyze:bundle', d: 'Analisis ukuran bundle' },
            { c: 'npm ls --all', d: 'Cek dependency tree lengkap' },
            { c: 'npm ls --engine-strict', d: 'Cek engine compatibility' },
          ],
        },
        {
          e: '🧹',
          t: 'Cleanup & Maintenance',
          b: 'Maintenance',
          i: [
            { c: 'npm run clean', d: 'Bersihkan folder build' },
            { c: 'rm -rf node_modules && npm install', d: 'Hapus node_modules & reinstall' },
            { c: 'npm run prepare', d: 'Reset Git hooks' },
            { c: 'npm cache clean --force', d: 'Clear npm cache' },
            { c: 'rm package-lock.json && npm install', d: 'Hapus lock file & regenerate' },
          ],
        },
      ];

      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function escAttr(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderCommands(query) {
        var c = document.getElementById('cmd-container');
        if (!c) return;
        var q = (query || '').toLowerCase().trim(),
          h = '',
          f = 0;
        for (var i = 0; i < COMMANDS.length; i++) {
          var cat = COMMANDS[i],
            r = '',
            v = false;
          for (var j = 0; j < cat.i.length; j++) {
            var it = cat.i[j];
            var m =
              !q ||
              it.c.toLowerCase().indexOf(q) !== -1 ||
              it.d.toLowerCase().indexOf(q) !== -1 ||
              cat.t.toLowerCase().indexOf(q) !== -1;
            if (m) {
              v = true;
              f++;
            }
            r +=
              '<div class="cmd-row"' +
              (m ? '' : ' style="display:none"') +
              '>' +
              '<code class="cmd-code">' +
              esc(it.c) +
              '</code>' +
              '<span class="cmd-desc">' +
              esc(it.d) +
              '</span>' +
              '<button class="copy-btn" title="Copy" data-cmd="' +
              escAttr(it.c) +
              '">📋</button></div>';
          }
          h +=
            '<section class="category"' +
            (q && !v ? ' style="display:none"' : '') +
            '>' +
            '<div class="cat-header"><span class="cat-emoji">' +
            cat.e +
            '</span>' +
            '<span class="cat-title">' +
            cat.t +
            '</span>' +
            '<span class="cat-count">' +
            cat.b +
            '</span></div>' +
            r +
            '</section>';
        }
        if (!f && q)
          h =
            '<div class="no-result"><span class="big">🔎</span>Tidak ada hasil untuk "' +
            esc(q) +
            '"</div>';
        c.innerHTML = h;
        var btns = c.querySelectorAll('.copy-btn');
        for (var k = 0; k < btns.length; k++) {
          btns[k].onclick = function () {
            var cmd = this.getAttribute('data-cmd');
            (navigator.clipboard || {}).writeText
              ? navigator.clipboard
                  .writeText(cmd)
                  .then(showToast)
                  .catch(function () {
                    var ta = document.createElement('textarea');
                    ta.value = cmd;
                    ta.style.cssText = 'position:fixed;opacity:0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showToast();
                  })
              : showToast();
            this.classList.add('copied');
            var self = this;
            setTimeout(function () {
              self.classList.remove('copied');
            }, 1200);
          };
        }
      }

      function showToast() {
        var t = document.getElementById('toast');
        if (t) {
          t.classList.add('show');
          setTimeout(function () {
            t.classList.remove('show');
          }, 1800);
        }
      }

      // Initial render — after PromptJS DOM is ready
      renderCommands('');
    </script>
  </body>
</html>
