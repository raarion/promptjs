<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptJS v1.1.1 — Command Reference</title>
    <script src="https://cdn.jsdelivr.net/npm/@raarion/prompt-js/dist/promptjs.standalone.min.js"></script>
    <link rel="pjs" href="commands-reference.pjs" />
  </head>
  <body>
    <!-- ⚡ Minimal helper: DOM filter + toast timer (batasan arsitektur: PromptJS belum punya array.filter() reaktif) -->
    <script>
      function filterPerintah(cari) {
        var q = (cari || '').toLowerCase().trim();
        var rows = document.querySelectorAll('.cmd-row');
        var cats = document.querySelectorAll('.category');
        cats.forEach(function (cat) {
          var vis = false;
          cat.querySelectorAll('.cmd-row').forEach(function (row) {
            var code = (row.querySelector('.cmd-code') || {}).textContent || '';
            var desc = (row.querySelector('.cmd-desc') || {}).textContent || '';
            var match =
              !q || code.toLowerCase().indexOf(q) !== -1 || desc.toLowerCase().indexOf(q) !== -1;
            row.classList.toggle('hidden', !match);
            if (match) vis = true;
          });
          cat.style.display = vis ? '' : 'none';
        });
        var noR = document.getElementById('no-result');
        if (q) {
          var vis = document.querySelectorAll('.cmd-row:not(.hidden)').length;
          if (!vis) {
            if (!noR) {
              noR = document.createElement('div');
              noR.id = 'no-result';
              noR.className = 'no-result';
              noR.innerHTML = '<span class="big">🔎</span>Tidak ada hasil';
              document.getElementById('cmd-container').appendChild(noR);
            }
            noR.style.display = '';
          } else if (noR) {
            noR.style.display = 'none';
          }
        } else if (noR) {
          noR.style.display = 'none';
        }
      }

      var _toastTimer;
      function tampilkanToast(teks) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = '✓ Tersalin! ' + (teks || '');
        t.classList.add('show');
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function () {
          t.classList.remove('show');
        }, 1800);
      }
    </script>
  </body>
</html>
