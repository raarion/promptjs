<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PromptJS v1.1.1 — Command Reference</title>
    <script src="https://cdn.jsdelivr.net/npm/@raarion/prompt-js/dist/promptjs.standalone.min.js"></script>
  </head>
  <body>
    <script type="text/pjs">
      ---
      judul: "PromptJS Command Reference"
      versi: "v1.1.1"
      placeholderCari: "Cari command... (misal: build, test, lint, audit)"
      kats:
        - nama: "NPM Scripts"
          emoji: "📦"
          badge: "package.json"
          cmds:
            - code: "npm test"
              desc: "Jalankan seluruh suite testing (Vitest)"
            - code: "npm run test:watch"
              desc: "Test dalam mode watch"
            - code: "npm run coverage"
              desc: "Test + laporan code coverage"
            - code: "npm run mutation"
              desc: "Stryker mutation testing"
            - code: "npm run lint"
              desc: "Periksa kode dengan ESLint"
            - code: "npm run lint:fix"
              desc: "Periksa & auto-fix ESLint"
            - code: "npm run typecheck"
              desc: "Type check JSDoc (TypeScript)"
            - code: "npm run format"
              desc: "Format kode dengan Prettier"
            - code: "npm run format:check"
              desc: "Cek format tanpa mengubah"
            - code: "npm run build"
              desc: "Build produksi lengkap"
            - code: "npm run standalone"
              desc: "Build bundle browser standalone"
            - code: "npm run pages:build"
              desc: "Build situs showcase"
            - code: "npm run pages:deploy"
              desc: "Deploy ke GitHub Pages"
            - code: "npm run audit"
              desc: "Cek kerentanan keamanan"
            - code: "npm run audit:fix"
              desc: "Auto-fix kerentanan keamanan"
        - nama: "CLI Commands"
          emoji: "💻"
          badge: "pjs"
          cmds:
            - code: "pjs compile <input> [output]"
              desc: "Kompilasi file .pjs → .html"
            - code: "pjs build <source> <dest>"
              desc: "Build seluruh project"
            - code: "pjs init [project-name]"
              desc: "Inisialisasi project baru"
            - code: "pjs serve [port]"
              desc: "Dev server + live reload"
            - code: "pjs watch <input> <output>"
              desc: "Watch mode auto-compile"
            - code: "pjs validate <file>"
              desc: "Validasi sintaks tanpa kompilasi"
            - code: "pjs version"
              desc: "Tampilkan versi PromptJS"
            - code: "pjs help"
              desc: "Tampilkan bantuan CLI"
            - code: "pjs -o, --output <dir>"
              desc: "Tentukan folder output"
            - code: "pjs -m, --minify"
              desc: "Minify output HTML/JS"
            - code: "pjs -s, --standalone"
              desc: "Gunakan runtime standalone"
            - code: "pjs -w, --watch"
              desc: "Enable watch mode"
            - code: "pjs -v, --verbose"
              desc: "Output detail/log verbose"
            - code: "pjs -c, --config <file>"
              desc: "Konfigurasi custom"
            - code: "pjs --no-cache"
              desc: "Disable caching build"
            - code: "pjs --sourcemap"
              desc: "Generate source map"
        - nama: "Git Hooks"
          emoji: "🔐"
          badge: "Husky"
          cmds:
            - code: "git add . && git commit -m \"...\""
              desc: "Pre-commit (lint-staged) otomatis"
            - code: "git push"
              desc: "Pre-push (full CI gate) otomatis"
        - nama: "Testing Commands"
          emoji: "🧪"
          badge: "Vitest"
          cmds:
            - code: "npx vitest run"
              desc: "Jalankan semua test"
            - code: "npx vitest watch"
              desc: "Test dalam mode watch"
            - code: "npx vitest run --coverage"
              desc: "Test + coverage report"
            - code: "npx vitest run tests/file.test.js"
              desc: "Jalankan test spesifik"
            - code: "npx vitest run --reporter=verbose"
              desc: "Output test detail"
            - code: "npx vitest run --bail=1"
              desc: "Stop setelah failure pertama"
            - code: "npx vitest run --grep \"pattern\""
              desc: "Filter by name pattern"
        - nama: "Code Quality Tools"
          emoji: "📊"
          badge: "ESLint · Prettier · tsc"
          cmds:
            - code: "npx eslint src/"
              desc: "Lint semua file src/"
            - code: "npx eslint src/**/*.js --fix"
              desc: "Auto-fix ESLint"
            - code: "npx eslint src/cli/index.js"
              desc: "Lint file spesifik"
            - code: "npx prettier --write src/"
              desc: "Format semua file src/"
            - code: "npx prettier --check src/"
              desc: "Cek format"
            - code: "npx prettier --write README.md"
              desc: "Format file spesifik"
            - code: "npx tsc --noEmit"
              desc: "Type check tanpa generate"
            - code: "npx tsc --noEmit --pretty"
              desc: "Type check output berwarna"
        - nama: "Package Management"
          emoji: "📦"
          badge: "npm"
          cmds:
            - code: "npm install"
              desc: "Install semua dependencies"
            - code: "npm install --production"
              desc: "Hanya production deps"
            - code: "npm install <package>"
              desc: "Install package baru"
            - code: "npm install <package> --save-dev"
              desc: "Install dev dependency"
            - code: "npm uninstall <package>"
              desc: "Uninstall package"
            - code: "npm update"
              desc: "Update semua packages"
            - code: "npm outdated"
              desc: "Cek package yang ada update"
            - code: "npm ls"
              desc: "List installed packages (tree)"
            - code: "npm audit"
              desc: "Cek kerentanan keamanan"
            - code: "npm audit --json"
              desc: "Audit format JSON"
            - code: "npm audit fix"
              desc: "Auto-fix (non-breaking)"
            - code: "npm audit fix --force"
              desc: "Auto-fix + breaking changes"
        - nama: "Release & Versioning"
          emoji: "🏷️"
          badge: "npm version"
          cmds:
            - code: "npm version patch"
              desc: "Bump patch: 1.1.1 → 1.1.2"
            - code: "npm version minor"
              desc: "Bump minor: 1.1.1 → 1.2.0"
            - code: "npm version major"
              desc: "Bump major: 1.1.1 → 2.0.0"
            - code: "npm version 1.2.3"
              desc: "Set versi spesifik"
            - code: "git tag -a v1.1.1 -m \"Release v1.1.1\""
              desc: "Buat Git tag"
            - code: "npm publish --access public"
              desc: "Publish ke npm registry"
            - code: "npm publish --dry-run"
              desc: "Simulasi publish"
        - nama: "GitHub Pages & Deploy"
          emoji: "🌐"
          badge: "Deploy"
          cmds:
            - code: "npm run pages:build"
              desc: "Build situs showcase"
            - code: "npm run pages:deploy"
              desc: "Deploy ke GitHub Pages"
            - code: "npx gh-pages -d dist-pages"
              desc: "Manual deploy via gh-pages"
        - nama: "Debugging & Inspection"
          emoji: "🔍"
          badge: "Debug"
          cmds:
            - code: "node --inspect src/cli/index.js compile app.pjs"
              desc: "Debug CLI"
            - code: "node --inspect-brk node_modules/.bin/vitest run tests/test.js"
              desc: "Debug test spesifik"
            - code: "npm pack --dry-run"
              desc: "Lihat isi package"
            - code: "npm run analyze:bundle"
              desc: "Analisis ukuran bundle"
            - code: "npm ls --all"
              desc: "Cek dependency tree lengkap"
            - code: "npm ls --engine-strict"
              desc: "Cek engine compatibility"
        - nama: "Cleanup & Maintenance"
          emoji: "🧹"
          badge: "Maintenance"
          cmds:
            - code: "npm run clean"
              desc: "Bersihkan folder build"
            - code: "rm -rf node_modules && npm install"
              desc: "Hapus node_modules & reinstall"
            - code: "npm run prepare"
              desc: "Reset Git hooks"
            - code: "npm cache clean --force"
              desc: "Clear npm cache"
            - code: "rm package-lock.json && npm install"
              desc: "Hapus lock file & regenerate"
      ---

      Halaman Utama:
          data cari = ""
          data toastTeks = ""

          Gaya:
              *
              *::before
              *::after
                  box-sizing: border-box
                  margin: 0
                  padding: 0

              body
                  font-family: 'Inter', 'SF Pro', system-ui, sans-serif
                  background: #0a0a1a
                  color: #e0e0f0
                  min-height: 100vh

              body::before
                  content: ""
                  position: fixed
                  inset: 0
                  background: radial-gradient(ellipse 80% 60% at 20% 10%, rgba(120,60,200,0.08), transparent), radial-gradient(ellipse 60% 80% at 80% 90%, rgba(0,180,180,0.06), transparent)
                  pointer-events: none
                  z-index: 0

              .container
                  position: relative
                  z-index: 1
                  max-width: 900px
                  margin: 0 auto
                  padding: 24px 20px 60px

              header
                  text-align: center
                  padding: 40px 0 24px

              header .logo
                  font-size: 3rem
                  display: block
                  margin-bottom: 8px
                  filter: drop-shadow(0 0 20px rgba(255,0,110,0.3))

              header h1
                  font-size: 2rem
                  font-weight: 800
                  background: linear-gradient(135deg, #ff006e, #ff99c8, #7dd3fc)
                  -webkit-background-clip: text
                  -webkit-text-fill-color: transparent
                  background-clip: text

              header p
                  color: #8888aa
                  margin-top: 6px
                  font-size: 0.95rem

              .badge-row
                  display: flex
                  gap: 8px
                  justify-content: center
                  flex-wrap: wrap
                  margin-top: 14px

              .badge
                  font-size: 0.72rem
                  font-weight: 700
                  padding: 4px 12px
                  border-radius: 20px
                  border: 1px solid rgba(255,255,255,0.1)
                  background: rgba(255,255,255,0.04)
                  color: #9999bb
                  letter-spacing: 0.02em

              .badge.hl
                  color: #7dd3fc
                  border-color: rgba(125,211,252,0.25)

              .search-wrap
                  position: sticky
                  top: 12px
                  z-index: 10
                  margin: 0 0 28px

              .search-box
                  width: 100%
                  padding: 12px 16px 12px 42px
                  border-radius: 12px
                  border: 1px solid rgba(255,255,255,0.1)
                  background: rgba(15,15,35,0.85)
                  backdrop-filter: blur(12px)
                  color: #e0e0f0
                  font-size: 0.95rem
                  outline: none
                  transition: border-color 0.2s

              .search-box:focus
                  border-color: #ff006e

              .search-icon
                  position: absolute
                  left: 14px
                  top: 50%
                  transform: translateY(-50%)
                  color: #666
                  pointer-events: none
                  font-size: 0.95rem

              .category
                  margin-bottom: 28px

              .cat-header
                  display: flex
                  align-items: center
                  gap: 10px
                  margin-bottom: 14px
                  padding-bottom: 8px
                  border-bottom: 1px solid rgba(255,255,255,0.06)

              .cat-emoji
                  font-size: 1.4rem

              .cat-title
                  font-size: 1.05rem
                  font-weight: 700
                  color: #c0c0d8

              .cat-count
                  font-size: 0.65rem
                  font-weight: 700
                  padding: 2px 8px
                  border-radius: 10px
                  background: rgba(255,255,255,0.05)
                  color: #6666aa

              .cmd-row
                  display: flex
                  align-items: center
                  gap: 10px
                  padding: 8px 12px
                  border-radius: 8px
                  transition: background 0.15s
                  margin-bottom: 2px

              .cmd-row:hover
                  background: rgba(255,255,255,0.03)

              .cmd-row.hidden
                  display: none

              .cmd-code
                  flex: 1
                  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace
                  font-size: 0.82rem
                  color: #7dd3fc
                  min-width: 0
                  overflow-wrap: anywhere
                  line-height: 1.5

              .cmd-desc
                  font-size: 0.78rem
                  color: #7777a0
                  flex-shrink: 0
                  max-width: 340px
                  min-width: 140px
                  line-height: 1.4

              .copy-btn
                  flex-shrink: 0
                  width: 32px
                  height: 32px
                  border-radius: 8px
                  border: 1px solid rgba(255,255,255,0.08)
                  background: rgba(255,255,255,0.03)
                  color: #555
                  cursor: pointer
                  display: flex
                  align-items: center
                  justify-content: center
                  transition: all 0.15s
                  font-size: 0.85rem

              .copy-btn:hover
                  color: #7dd3fc
                  border-color: rgba(125,211,252,0.3)
                  background: rgba(125,211,252,0.06)

              .copy-btn.copied
                  color: #86efac
                  border-color: rgba(134,239,172,0.4)
                  background: rgba(134,239,172,0.08)

              .no-result
                  text-align: center
                  padding: 60px 20px
                  color: #5555aa

              .no-result .big
                  font-size: 3rem
                  display: block
                  margin-bottom: 12px

              .toast
                  position: fixed
                  bottom: 24px
                  left: 50%
                  transform: translateX(-50%) translateY(100px)
                  background: #1a1a30
                  border: 1px solid rgba(134,239,172,0.3)
                  color: #86efac
                  padding: 10px 20px
                  border-radius: 10px
                  font-size: 0.85rem
                  font-weight: 600
                  z-index: 100
                  pointer-events: none
                  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1)
                  box-shadow: 0 8px 32px rgba(0,0,0,0.4)

              .toast.show
                  transform: translateX(-50%) translateY(0)

              footer
                  text-align: center
                  padding: 20px
                  color: #444466
                  font-size: 0.75rem
                  border-top: 1px solid rgba(255,255,255,0.04)
                  margin-top: 32px

              footer a
                  color: #7dd3fc
                  text-decoration: none

              @media (max-width: 680px)
                  header h1
                      font-size: 1.5rem

                  .cmd-row
                      flex-wrap: wrap
                      gap: 6px

                  .cmd-code
                      flex-basis: 100%

                  .cmd-desc
                      flex-basis: calc(100% - 46px)
                      max-width: none

                  .copy-btn
                      order: 3

          Buat div.container:
              Buat header:
                  Buat span.logo: "🌀"
                  Buat h1: $judul
                  Buat p: "Klik ikon 📋 — copy command langsung ke clipboard"
                  Buat div.badge-row:
                      Buat span.badge.hl: $versi
                      Buat span.badge: "60+ commands"
                      Buat span.badge: "10 kategori"
                      Buat span.badge: "🇮🇩 Standalone"

              Buat div.search-wrap:
                  Buat span.search-icon: "🔍"
                  Buat masukan#search-input.search-box:
                      placeholder = $placeholderCari
                      on_diketik = simpan document.querySelector("#search-input").value ke cari

              Buat div#cmd-container:
                  Ulangi untuk kat in kats:
                      Buat bagian.category:
                          Buat div.cat-header:
                              Buat span.cat-emoji: kat.emoji
                              Buat span.cat-title: kat.nama
                              Buat span.cat-count: kat.badge

                          Ulangi untuk cmd in kat.cmds:
                              Buat div.cmd-row:
                                  Buat code.cmd-code: cmd.code
                                  Buat span.cmd-desc: cmd.desc
                                  Buat tombol.copy-btn:
                                      "📋"
                                      on_klik = navigator.clipboard.writeText(cmd.code)

              Buat footer:
                  Buat span:
                      "Dibangun dengan 💚 di Indonesia · "
                      Buat a:
                          "github.com/raarion/promptjs"
                          href = "https://github.com/raarion/promptjs"

              Buat div.toast#toast:
                  toastTeks

          Saat cari:
              jalankan filterPerintah(cari)

          Saat toastTeks:
              Jika toastTeks tidak sama dengan "":
                  jalankan tampilkanToast(toastTeks)
    </script>

    <!-- ⚡ Minimal helper: DOM filter + toast timer (batasan arsitektur: PromptJS belum punya array.filter() reaktif) -->
    <script>
      function filterPerintah(cari) {
        var q = ((cari && cari.value) || '').toLowerCase().trim();
        var rows = document.querySelectorAll('.cmd-row');
        var cats = document.querySelectorAll('.category');
        cats.forEach(function (cat) {
          var vis = false;
          cat.querySelectorAll('.cmd-row').forEach(function (row) {
            var code = (row.querySelector('.cmd-code') || {}).textContent || '';
            var desc = (row.querySelector('.cmd-desc') || {}).textContent || '';
            var match =
              !q || code.toLowerCase().indexOf(q) !== -1 || desc.toLowerCase().indexOf(q) !== -1;
            row.classList.toggle('hidden', !match);
            if (match) vis = true;
          });
          cat.style.display = vis ? '' : 'none';
        });
        var noR = document.getElementById('no-result');
        if (q) {
          var vis = document.querySelectorAll('.cmd-row:not(.hidden)').length;
          if (!vis) {
            if (!noR) {
              noR = document.createElement('div');
              noR.id = 'no-result';
              noR.className = 'no-result';
              noR.innerHTML = '<span class="big">🔎</span>Tidak ada hasil';
              document.getElementById('cmd-container').appendChild(noR);
            }
            noR.style.display = '';
          } else if (noR) {
            noR.style.display = 'none';
          }
        } else if (noR) {
          noR.style.display = 'none';
        }
      }

      var _toastTimer;
      function tampilkanToast(teks) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = '✓ Tersalin! ' + (teks && teks.value ? teks.value.substring(0, 40) : '');
        t.classList.add('show');
        if (_toastTimer) clearTimeout(_toastTimer);
        _toastTimer = setTimeout(function () {
          t.classList.remove('show');
        }, 1800);
      }
    </script>
  </body>
</html>
